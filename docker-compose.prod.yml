services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auttus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auttus
    volumes:
      - bdc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auttus -d auttus"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://auttus:${POSTGRES_PASSWORD}@postgres:5432/auttus
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_RESET_LINKS: "false"
      AUTH_URL: https://bdc.ottiv.io
      SELLERS_GROUP_WEBHOOK_URL: ${SELLERS_GROUP_WEBHOOK_URL:-}
      WAVOIP_DEVICE_TOKEN: ${WAVOIP_DEVICE_TOKEN:-}
      CHATWOOT_URL: ${CHATWOOT_URL:-https://on.ottiv.io}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_OFFICIAL_INBOX_ID: ${CHATWOOT_OFFICIAL_INBOX_ID:-}
      AUTTUS_APP_URL: ${AUTTUS_APP_URL:-https://app.auttus.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: bdc.ottiv.io
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - public

networks:
  internal:
  public:

volumes:
  bdc_postgres_data:
  caddy_data:
  caddy_config:
