services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bdc_dev
    ports:
      - "5432:5432"
    volumes:
      - bdc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bdc_dev
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_RESET_LINKS: "false"
      WAVOIP_DEVICE_TOKEN: ${WAVOIP_DEVICE_TOKEN:-}
      CHATWOOT_URL: ${CHATWOOT_URL:-https://on.ottiv.io}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_OFFICIAL_INBOX_ID: ${CHATWOOT_OFFICIAL_INBOX_ID:-}
      AUTTUS_APP_URL: ${AUTTUS_APP_URL:-https://app.auttus.com}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bdc_postgres_data:
